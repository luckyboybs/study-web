# ============================================================
# study.example.com — 初中学习资产查阅端（纯静态 + 可选的 Basic Auth）
# 数据来源：数据生产侧增量推送 -> <WEB_ROOT>/data/（见 study_web_contract.md）
#
# 本文件是【部署示例】：文中 <...> 全是占位符，部署时替换为你自己的值。
#   <WEB_ROOT>        站点根目录（index.html / app.js / styles.css / assets 所在目录）
#   <AUTH_USER_FILE>  Basic Auth 用户文件路径（自行生成，切勿提交进仓库）
#
# 若要启用 HTTPS：按 study.example.com.ssl.conf.staged 头部注释操作，
# 并用你的证书颁发机构（如 certbot）为你的域名签发证书。
# ============================================================

server {
    listen 80;
    server_tokens off;
    server_name study.example.com;

    root <WEB_ROOT>;
    index index.html index.htm;

    # 纯静态站点，禁止目录列表
    autoindex off;

    # Basic Auth（可选；用户文件建议 root:www-data 640，不要入库）
    auth_basic "Study";
    auth_basic_user_file <AUTH_USER_FILE>;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    # 证书 webroot 校验预留：签证书时无需改动本文件
    # （^~ 前缀优先，避免被下方禁点文件规则拦截）
    location ^~ /.well-known/acme-challenge/ {
        root <WEB_ROOT>;
        auth_basic off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 讲解 md 以纯文本下发（mime.types 无 .md 映射，默认是 octet-stream）
    location ~* \.md$ {
        default_type text/plain;
        charset utf-8;
    }

    # 自托管字体子集（assets/fonts/）：文件名稳定，按 immutable 长缓存
    location ^~ /assets/fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "self";
    }

    # index.json 随推送更新，禁缓存保证刷新即见
    location = /data/index.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(html)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(css|js)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
